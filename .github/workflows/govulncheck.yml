# Weekly scan for known vulnerabilities in code the module actually calls,
# Go standard library included. Releases build on setup-go's stable (see
# release.yml), so the scan does too and stdlib results match what ships.
name: govulncheck

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
